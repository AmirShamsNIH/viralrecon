$schema: "http://json-schema.org/draft-07/schema#"
description: >
  Structure of the merged run configuration, checked at DAG-build time so a
  missing or mistyped key is named before anything is submitted.

type: object
required: [options, project, samples, references, images, parameters]
properties:

  options:
    type: object
    required: [output, platform]
    properties:
      output:   {type: string, description: "run directory"}
      platform: {type: string, description: "reference set to use, e.g. BIOWULF"}

  project:
    type: object
    required: [paired]
    properties:
      paired: {type: boolean}

  samples:
    type: array
    minItems: 1
    items: {type: string}

  images:
    type: object
    description: >
      Tool name to container image path. A missing entry fails at parse time,
      not when the rule that needs it is first scheduled.

  references:
    type: object
    required: [target]

  parameters:
    type: object
    required: [pre_process, alignment, variant_calling, report, lineage]
    properties:

      pre_process:
        type: object
        required: [kraken2_decon_db, kraken2_decon_taxids, krona_taxonomy]
        properties:
          kraken2_decon_db:
            type: string
            description: "Kraken2 database directory used for depletion"
          kraken2_decon_taxids:
            type: string
            description: >
              Root taxids to subtract with descendants. The target virus is in the
              database, so keeping only unclassified reads would discard it.
          krona_taxonomy: {type: string}

      alignment:
        type: object
        required: [min_mapped_reads, skip_markduplicates, samtools_filter]
        properties:
          min_mapped_reads:    {type: string}
          skip_markduplicates: {type: string, enum: ["true", "false"]}
          samtools_filter:     {type: string}

      variant_calling:
        type: object
        required: [freebayes, consensus_min_depth, min_genome_coverage]
        properties:
          freebayes:           {type: string}
          consensus_min_depth: {type: string}
          min_genome_coverage:
            type: string
            description: >
              Fraction of the reference that must reach consensus_min_depth. A
              divergent reference can draw many reads yet leave most of it uncovered.

      report:
        type: object
        required: [bcftools_merge, snpeff]

      lineage:
        type: object
        properties:
          nextclade:
            type: string
            description: >
              Extra flags for `nextclade run`. It runs for any target whose
              genome.json entry carries a nextclade_dataset.
