$schema: "http://json-schema.org/draft-07/schema#"
description: >
  Structure of the merged run configuration. This exists because a missing or
  mistyped key used to surface as a KeyError deep inside a rule, on a compute
  node, minutes or hours into a run - the failure mode hit repeatedly while
  adding parameters. Validation runs at DAG-build time, before anything is
  submitted, and names the offending key.

type: object
required: [options, project, samples, references, images, parameters]
properties:

  options:
    type: object
    required: [output, platform]
    properties:
      output:   {type: string, description: "run directory"}
      platform: {type: string, description: "reference set to use, e.g. BIOWULF"}

  project:
    type: object
    required: [paired]
    properties:
      paired: {type: boolean}

  samples:
    type: array
    minItems: 1
    items: {type: string}

  images:
    type: object
    description: >
      Tool name to container image path. Every rule with a shell body reads one
      of these; a missing entry fails the whole workflow at parse time rather
      than when that rule is first scheduled.

  references:
    type: object
    required: [target]

  parameters:
    type: object
    required: [pre_process, alignment, variant_calling, report, lineage]
    properties:

      pre_process:
        type: object
        required: [kraken2_decon_db, kraken2_decon_taxids, krona_taxonomy]
        properties:
          kraken2_decon_db:
            type: string
            description: "Kraken2 database directory used for depletion"
          kraken2_decon_taxids:
            type: string
            description: >
              Space-separated root taxids to subtract, with descendants.
              Depletion is subtractive by taxon on purpose: the target virus is
              in the database and comes back classified, so a keep-unclassified
              filter would discard exactly the reads of interest.
          krona_taxonomy: {type: string}

      alignment:
        type: object
        required: [min_mapped_reads, skip_markduplicates, samtools_filter]
        properties:
          min_mapped_reads:    {type: string}
          skip_markduplicates: {type: string, enum: ["true", "false"]}
          samtools_filter:     {type: string}

      variant_calling:
        type: object
        required: [freebayes, consensus_min_depth, min_genome_coverage]
        properties:
          freebayes:           {type: string}
          consensus_min_depth: {type: string}
          min_genome_coverage:
            type: string
            description: >
              Fraction of the reference that must reach consensus_min_depth
              before a target is trusted. Catches what a read count cannot: a
              divergent reference can attract millions of cross-mapping reads
              and still leave most of the genome uncovered.

      report:
        type: object
        required: [bcftools_merge, snpeff]

      lineage:
        type: object
        required: [pangolin_targets]
        properties:
          freyja_targets:      {type: array, items: {type: string}}
          pangolin_targets:
            type: array
            minItems: 1
            items: {type: string}
            description: >
              Substrings matched against target names, by accession rather than
              a name prefix, since a prefix like "SARS" would wrongly catch
              SARS-CoV-1. Pangolin describes SARS-CoV-2 and nothing else.
              Nextclade is not listed here: it is gated on whether a target
              carries a nextclade_dataset path in genome.json.
