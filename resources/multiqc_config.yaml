# MultiQC config: strip sample-name decorations so each sample is one row, and ignore
# the pre-filter *.bowtie2_map.raw.flagstat, which would show as a phantom sample.

fn_ignore_files:
  - "*.raw.flagstat"

# bcftools_consensus headers are {sample}.{target}; "_consensus" covers older FASTAs.
extra_fn_clean_exts:
  - "_consensus"
  - ".bowtie2_map"
  - ".freebayes_haplotypecaller"
  - ".snpsift_filtered"
  - ".kraken2_decon"
  - ".fastp_trim"
  - ".bbtools_reformat"

# Order sections by where they sit in the pipeline, so a report reads in the
# order the work happened rather than alphabetically.
module_order:
  - fastqc
  - fastp
  - kraken
  - bowtie2
  - samtools
  - picard
  - mosdepth
  - bcftools
  - snpeff
  - nextclade

table_columns_visible:
  Samtools:
    flagstat_total: true

report_header_info:
  - Pipeline: "viralrecon"
  - Containers: "all tools run from pinned Singularity images"
