# MultiQC configuration for viralrecon.
#
# Two problems this solves that cannot be fixed at the rule level:
#
# 1. Sample-name decoration. The lineage callers take their sample name from
#    the consensus FASTA header (SAMPLE_TARGET_consensus) while other tools
#    derive it from the filename, so one sample renders as several unrelated
#    rows. The cleaning rules below strip the decorations so everything lands
#    on one row per sample and can be compared at a glance.
#
# 2. The pre-filter flagstat. bowtie2_map writes *.bowtie2_map.raw.flagstat to
#    record the true library mapping rate before unmapped records are dropped.
#    It is deliberately not a MultiQC input; without ignoring it here MultiQC
#    finds it by directory scan and reports it as a second, phantom sample.

fn_ignore_files:
  - "*.raw.flagstat"

# bcftools_consensus writes the header as {sample}.{target}, matching the key
# other tools derive from the filename. "_consensus" is kept for consensus
# FASTAs produced before that change.
extra_fn_clean_exts:
  - "_consensus"
  - ".bowtie2_map"
  - ".freebayes_haplotypecaller"
  - ".snpsift_filtered"
  - ".kraken2_decon"
  - ".fastp_trim"
  - ".bbtools_reformat"

# Order sections by where they sit in the pipeline, so a report reads in the
# order the work happened rather than alphabetically.
module_order:
  - fastqc
  - fastp
  - kraken
  - bowtie2
  - samtools
  - picard
  - mosdepth
  - bcftools
  - snpeff
  - nextclade

table_columns_visible:
  Samtools:
    flagstat_total: true

report_header_info:
  - Pipeline: "viralrecon"
  - Containers: "all tools run from pinned Singularity images"
