<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 170" width="1052" height="170" role="img" aria-labelledby="title">
  <title id="title">viralrecon workflow: 1 Reference build, 2 Read clean-up, 3 Composition, 4 Alignment, 5 Variant calling, 6 Consensus, 7 Clade, 8 Reporting</title>
  <style>
    .cell { fill: #FFFFFF; stroke: #D3DDD9; stroke-width: 1; }
    .rule { stroke: #D3DDD9; stroke-width: 1; }
    .bar { stroke: #0E6B5F; stroke-width: 3; }
    .opt { stroke-dasharray: 6 4; }
    .n { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #56665F; }
    .t { font: 600 14px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #14201E; }
    .s { font: 12.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #56665F; }
    @media (prefers-color-scheme: dark) {
      .cell { fill: #131C1B; stroke: #24322F; }
      .rule { stroke: #24322F; }
      .bar { stroke: #52C2AE; }
      .n, .s { fill: #94A7A0; }
      .t { fill: #E2ECE8; }
    }
  </style>

  <rect class="cell" x="0.5" y="0.5" width="1051" height="77"/>
  <line class="rule" x1="263" y1="3" x2="263" y2="77.5"/>
  <line class="rule" x1="526" y1="3" x2="526" y2="77.5"/>
  <line class="rule" x1="789" y1="3" x2="789" y2="77.5"/>
  <line class="bar" x1="0" y1="1.5" x2="263" y2="1.5"/>
  <line class="bar" x1="263" y1="1.5" x2="526" y2="1.5"/>
  <line class="bar" x1="526" y1="1.5" x2="789" y2="1.5"/>
  <line class="bar" x1="789" y1="1.5" x2="1052" y2="1.5"/>

  <text class="n" x="16" y="23">1</text>
  <text class="t" x="16" y="44">Reference build</text>
  <text class="s" x="16" y="64">Genome, annotation, indexes</text>

  <text class="n" x="279" y="23">2</text>
  <text class="t" x="279" y="44">Read clean-up</text>
  <text class="s" x="279" y="64">Repair, trim, filter</text>

  <text class="n" x="542" y="23">3</text>
  <text class="t" x="542" y="44">Composition</text>
  <text class="s" x="542" y="64">Classify, deplete host</text>

  <text class="n" x="805" y="23">4</text>
  <text class="t" x="805" y="44">Alignment</text>
  <text class="s" x="805" y="64">Map, measure depth</text>

  <rect class="cell" x="0.5" y="92.5" width="1051" height="77"/>
  <line class="rule" x1="263" y1="95" x2="263" y2="169.5"/>
  <line class="rule" x1="526" y1="95" x2="526" y2="169.5"/>
  <line class="rule" x1="789" y1="95" x2="789" y2="169.5"/>
  <line class="bar" x1="0" y1="93.5" x2="263" y2="93.5"/>
  <line class="bar" x1="263" y1="93.5" x2="526" y2="93.5"/>
  <line class="bar opt" x1="526" y1="93.5" x2="789" y2="93.5"/>
  <line class="bar" x1="789" y1="93.5" x2="1052" y2="93.5"/>

  <text class="n" x="16" y="115">5</text>
  <text class="t" x="16" y="136">Variant calling</text>
  <text class="s" x="16" y="156">Call, normalise, annotate</text>

  <text class="n" x="279" y="115">6</text>
  <text class="t" x="279" y="136">Consensus</text>
  <text class="s" x="279" y="156">Depth-masked genome</text>

  <text class="n" x="542" y="115">7</text>
  <text class="t" x="542" y="136">Clade</text>
  <text class="s" x="542" y="156">Nextclade, when a dataset exists</text>

  <text class="n" x="805" y="115">8</text>
  <text class="t" x="805" y="136">Reporting</text>
